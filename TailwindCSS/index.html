<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind CSS Demo</title>

    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body>
    <div class="mt-20 mx-52 flex flex-wrap rounded-lg border-2 border-black">
      <!-- Quote Container -->
      <div
        class="w-full h-24 bg-gradient-to-t from-sky-500 to-indigo-500 text-white rounded-t flex items-center justify-center font-bold text-xl "
      >
        News you can Trust.
      </div>
      <!-- Content Container -->
      <div class="w-full text-center mt-6">
        <h3 class="text-lg font-semibold">Stay up to date with the Latest!</h3>
        <p>
          Subscribe to our newsletter fo the latest news straight into your
          inbox.
        </p>
        <form class="flex flex-wrap">
          <input
            type="text"
            placeholder="your@email.com"
            class="w-full mx-52 bg-slate-200 text-center placeholder:text-sm my-4 py-2 rounded"
          />
          <button class="w-full bg-blue-500 text-white mx-52 py-2 rounded-full">
            Subscribe Now
          </button>
        </form>
        <p class="my-6 mt-6 text-sm">We value your privacy</p>
      </div>
    </div>
  </body>
</html>
